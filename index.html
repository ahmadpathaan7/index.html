<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khan Studio AI Automation</title>
  <style>
    body { background-color: #121212; color: #ffffff; font-family: sans-serif; padding: 20px; text-align: center; }
    .container { max-width: 500px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 12px; }
    input, select, textarea, button { width: 100%; margin-top: 10px; padding: 10px; border-radius: 6px; border: none; box-sizing: border-box; }
    button { background-color: #9ecc3b; color: #000; font-weight: bold; cursor: pointer; font-size: 16px; }
    textarea { height: 120px; resize: vertical; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🚀 Khan Automation Studio</h2>
    
    <label>Server URL:</label>
    <input type="text" id="serverUrl" value="https://khan-yt-backend.onrender.com">

    <label>🔑 Pro Password:</label>
    <input type="password" id="proPassword" placeholder="Enter Pro Password">

    <label>Script Input (Voice Line || Prompt):</label>
    <textarea id="scriptInput" placeholder="یہ کہانی ہے... || A dramatic shot..."></textarea>

    <button onclick="startRender()">🚀 GENERATE AUTOMATED VIDEO</button>
  </div>

  <script>
    async function startRender() {
      const serverUrl = document.getElementById('serverUrl').value.trim();
      const password = document.getElementById('proPassword').value.trim();
      const script = document.getElementById('scriptInput').value.trim();
      
      if(!serverUrl) { alert("سرور URL درج کریں!"); return; }
      if(!script) { alert("اسکرپٹ درج کریں!"); return; }

      const formData = new FormData();
      formData.append('password', password);
      formData.append('script', script);

      try {
        const response = await fetch(`${serverUrl}/render`, { method: 'POST', body: formData });
        const data = await response.json();
        
        if(response.ok) {
          alert("🚀 ویڈیو پروسیسنگ شروع ہو گئی ہے! جاب ID: " + data.job_id);
          pollStatus(serverUrl, data.job_id);
        } else {
          alert("❌ ایرر: " + (data.detail || "سرور کا مسئلہ!"));
        }
      } catch (err) {
        alert("❌ سرور سے کنکشن نہیں ہو سکا۔");
      }
    }

    async function pollStatus(serverUrl, jobId) {
      const interval = setInterval(async () => {
        try {
          const res = await fetch(`${serverUrl}/status/${jobId}`);
          const result = await res.json();
          
          if(result.status === "completed") {
            clearInterval(interval);
            const fullVideoUrl = `${serverUrl}${result.video_url}`;
            alert("🎉 ویڈیو تیار ہے!");
            window.open(fullVideoUrl, '_blank');
          } else if(result.status === "failed") {
            clearInterval(interval);
            alert("❌ ایرر: " + result.error);
          }
        } catch (e) {
          console.log("Waiting...");
        }
      }, 10000);
    }
  </script>
</body>
</html>
