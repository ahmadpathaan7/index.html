<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khan Institute YT Automation (Power Mode Ultimate)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background: #0a0d0b; 
    color: #eef0ec; 
    font-family: system-ui, -apple-system, sans-serif; 
    padding: 20px 10px; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
  }
  .box { 
    width: 100%; 
    max-width: 620px; 
    background: #131815; 
    padding: 28px; 
    border-radius: 16px; 
    border: 1px solid #222b26; 
    box-shadow: 0 16px 40px rgba(0,0,0,0.8); 
  }
  
  .header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid #222b26; padding-bottom: 14px; }
  .header h2 { font-size: 22px; color: #fff; letter-spacing: 0.5px; }
  .header p { color: #8a958d; font-size: 12px; margin-top: 4px; }
  
  .section-title { font-size: 12px; color: #c9f158; font-weight: 700; text-transform: uppercase; margin: 18px 0 10px 0; display: flex; align-items: center; gap: 6px; }
  .section-title::after { content: ''; flex: 1; height: 1px; background: #222b26; }
  
  .form-group { margin-bottom: 14px; text-align: left; }
  label { font-size: 11px; color: #a3b3a9; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-weight: 600; }
  
  input, textarea, select { width: 100%; padding: 11px 13px; background: #0c0f0d; border: 1px solid #222b26; color: #fff; border-radius: 8px; font-size: 13px; outline: none; transition: 0.2s; }
  input:focus, textarea:focus, select:focus { border-color: #c9f158; }
  textarea { resize: vertical; min-height: 90px; }
  
  .row { display: flex; gap: 10px; }
  .col { flex: 1; }
  
  .btn-main { width: 100%; padding: 15px; background: #c9f158; color: #000; font-weight: 800; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; margin-top: 15px; transition: 0.2s; }
  .btn-main:hover { background: #b5dc43; }
  
  .footer-branding { text-align: center; margin-top: 20px; padding-top: 12px; border-top: 1px solid #1f2722; font-size: 12px; color: #8a958d; }
  .footer-branding span { color: #c9f158; font-weight: 700; }
</style>
</head>
<body>

<div class="box">
  <div class="header">
    <h2>Khan Institute YT Automation</h2>
    <p>Power Mode Ultimate — AI Video Studio</p>
  </div>

  <!-- Server Link & Pro Password -->
  <span class="section-title">1. Server & Authentication</span>
  <div class="row">
    <div class="col form-group">
      <label>🔗 Render Server URL</label>
      <input type="text" id="serverUrl" value="https://khan-yt-backend.onrender.com">
    </div>
    <div class="col form-group">
      <label>🔑 Pro Access Password</label>
      <input type="password" id="proPassword" placeholder="Enter Pro Password">
    </div>
  </div>

  <!-- Visual Style & Captions -->
  <span class="section-title">2. Visual Engine & Captions</span>
  <div class="row">
    <div class="col form-group">
      <label>🎨 Visual Style Preset</label>
      <select id="visualStyle">
        <option value="cinematic-doc">Cinematic Documentary</option>
        <option value="3d-anim">3D Animation / Pixar Style</option>
        <option value="anime">Anime / Studio Ghibli</option>
        <option value="whiteboard">Whiteboard / Hand Drawn</option>
        <option value="explainer">2D Vector Explainer</option>
      </select>
    </div>
    <div class="col form-group">
      <label>💬 Smart Auto-Captions</label>
      <select id="captionStyle">
        <option value="capcut-yellow">CapCut Style (Yellow Highlight)</option>
        <option value="tiktok-bold">TikTok Bold Pop-up</option>
        <option value="clean-sub">Clean Cinema Subtitles</option>
        <option value="off">Disable Captions</option>
      </select>
    </div>
  </div>

  <!-- BGM Audio Mixing & FX -->
  <span class="section-title">3. BGM Auto-Mixing & Sound FX</span>
  <div class="row">
    <div class="col form-group">
      <label>🎵 Background Music (BGM Track)</label>
      <select id="bgmTrack">
        <option value="suspense-mystery">Dark Suspense & Mystery</option>
        <option value="dramatic-history">Dramatic Historical Beat</option>
        <option value="energetic-hype">High Energy / Tech Hype</option>
        <option value="calm-ambient">Calm Ambient Focus</option>
        <option value="none">No Background Music</option>
      </select>
    </div>
    <div class="col form-group">
      <label>🎚️ Auto-Ducking (BGM Balance)</label>
      <select id="bgmDucking">
        <option value="auto-80">Smart Ducking (-80% during Voice)</option>
        <option value="auto-60">Medium Ducking (-60% during Voice)</option>
        <option value="off">Constant Volume (No Ducking)</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div class="col form-group">
      <label>🔊 Sound FX Transitions</label>
      <select id="sfxMode">
        <option value="whoosh-impact">Whooshes + Deep Riser SFX</option>
        <option value="subtle-cinematic">Subtle Cinematic Hits</option>
        <option value="none">No Sound FX</option>
      </select>
    </div>
    <div class="col form-group">
      <label>🎥 Camera Motion</label>
      <select id="cameraMotion">
        <option value="ken-burns">Ken Burns (Dynamic Zoom In/Out)</option>
        <option value="pan-right">Slow Dynamic Pan</option>
        <option value="static">Static (No Motion)</option>
      </select>
    </div>
  </div>

  <!-- Audio Voice Controls -->
  <span class="section-title">4. Humanized Voice Controls</span>
  <div class="row">
    <div class="col form-group">
      <label>🎙️ Voice Model</label>
      <select id="voiceGender">
        <option value="male-deep">👨 Urdu Male (Deep Doc Voice)</option>
        <option value="female-calm">👩 Urdu Female (Storyteller)</option>
        <option value="male-energetic">👨 English Male (Energetic)</option>
        <option value="female-dramatic">👩 English Female (Dramatic)</option>
      </select>
    </div>
    <div class="col form-group">
      <label>✂️ Silence Trim</label>
      <select id="silenceTrim">
        <option value="auto">Auto-Remove Pauses (Fast Pace)</option>
        <option value="none">Keep Natural Pauses</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div class="col form-group">
      <label>🎚️ Pitch Modulation</label>
      <select id="voicePitch">
        <option value="+0Hz">Natural Pitch</option>
        <option value="-5Hz">Deep Radio Voice (-5Hz)</option>
        <option value="+4Hz">Soft Accent (+4Hz)</option>
      </select>
    </div>
    <div class="col form-group">
      <label>⚡ Pace & Speed</label>
      <select id="voiceRate">
        <option value="+0%">Normal Rate</option>
        <option value="+10%">Dynamic Fast (+10%)</option>
        <option value="-8%">Dramatic Slow (-8%)</option>
      </select>
    </div>
  </div>

  <!-- Script Input -->
  <span class="section-title">5. Script Input</span>
  <div class="form-group">
    <label>📝 Script (Voice Line || Image Prompt)</label>
    <textarea id="scriptInput" placeholder="Voice Line || Image Prompt"></textarea>
  </div>

  <button class="btn-main" onclick="startRender()">🚀 START PARALLEL POWER RENDER</button>

  <div class="footer-branding">
    Created with ❤️ by <span>Cyber Expert Ahmad Khan</span>
  </div>
</div>

<script>
  async function startRender() {
    const serverUrl = document.getElementById('serverUrl').value.trim();
    const password = document.getElementById('proPassword').value.trim();
    const visualStyle = document.getElementById('visualStyle').value;
    const captionStyle = document.getElementById('captionStyle').value;
    const bgmTrack = document.getElementById('bgmTrack').value;
    const bgmDucking = document.getElementById('bgmDucking').value;
    const sfxMode = document.getElementById('sfxMode').value;
    const cameraMotion = document.getElementById('cameraMotion').value;
    const voiceGender = document.getElementById('voiceGender').value;
    const silenceTrim = document.getElementById('silenceTrim').value;
    const voicePitch = document.getElementById('voicePitch').value;
    const voiceRate = document.getElementById('voiceRate').value;
    const script = document.getElementById('scriptInput').value.trim();
    
    if(!serverUrl) { alert("سرور URL درج کریں!"); return; }
    if(!password) { alert("پرو پاسورڈ داخل کرنا لازمی ہے!"); return; }
    if(!script) { alert("اسکرپٹ درج کریں!"); return; }
    
    const formData = new FormData();
    formData.append('password', password);
    formData.append('script', script);
    formData.append('visualStyle', visualStyle);
    formData.append('captionStyle', captionStyle);
    formData.append('bgmTrack', bgmTrack);
    formData.append('bgmDucking', bgmDucking);
    formData.append('sfxMode', sfxMode);
    formData.append('cameraMotion', cameraMotion);
    formData.append('silenceTrim', silenceTrim);
    formData.append('voiceGender', voiceGender);
    formData.append('voicePitch', voicePitch);
    formData.append('voiceRate', voiceRate);

    try {
      const response = await fetch(`${serverUrl}/render`, { method: 'POST', body: formData });
      const data = await response.json();
      if(response.ok) {
        alert("🚀 آٹو مکسنگ ویڈیو پروسیسنگ شروع ہو گئی ہے! جاب ID: " + data.job_id);
      } else {
        alert("❌ ایرر: " + (data.detail || "غلط پاسورڈ یا سرور ایشو!"));
      }
    } catch (err) {
      alert("❌ سرور سے کنکشن قائم نہیں ہو سکا۔ چیک کریں کہ Render سرور آن ہے۔");
    }
  }
</script>

</body>
</html>
