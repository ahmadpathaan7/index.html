<script>
  async function startRender() {
    const serverUrl = document.getElementById('serverUrl').value.trim();
    const password = document.getElementById('proPassword').value.trim();
    const visualStyle = document.getElementById('visualStyle').value;
    const captionStyle = document.getElementById('captionStyle').value;
    const bgmFileInput = document.getElementById('bgmFile');
    const sfxMode = document.getElementById('sfxMode').value;
    const cameraMotion = document.getElementById('cameraMotion').value;
    const voiceGender = document.getElementById('voiceGender').value;
    const voiceEmotion = document.getElementById('voiceEmotion').value;
    const script = document.getElementById('scriptInput').value.trim();
    
    if(!serverUrl) { alert("سرور URL درج کریں!"); return; }
    if(!script) { alert("اسکرپٹ درج کریں!"); return; }

    const isProFeatureUsed = (
      captionStyle.includes('capcut') || captionStyle.includes('tiktok') ||
      sfxMode !== 'none' ||
      cameraMotion !== 'static' ||
      voiceEmotion !== 'none'
    );

    if(isProFeatureUsed && !password) {
      alert("🔒 آپ پرو فیچرز استعمال کر رہے ہیں۔ براہ کرم Pro Access Password درج کریں!");
      return;
    }
    
    const formData = new FormData();
    formData.append('password', password);
    formData.append('script', script);
    formData.append('visualStyle', visualStyle);
    formData.append('captionStyle', captionStyle);
    formData.append('sfxMode', sfxMode);
    formData.append('cameraMotion', cameraMotion);
    formData.append('voiceGender', voiceGender);
    formData.append('voiceEmotion', voiceEmotion);

    if(bgmFileInput.files.length > 0) {
      formData.append('bgmFile', bgmFileInput.files[0]);
    }

    try {
      const response = await fetch(`${serverUrl}/render`, { method: 'POST', body: formData });
      const data = await response.json();
      
      if(response.ok) {
        alert("🚀 ویڈیو پروسیسنگ شروع ہو گئی ہے! جاب ID: " + data.job_id + "\nویڈیو کا انتظار کریں...");
        pollStatus(serverUrl, data.job_id);
      } else {
        alert("❌ ایرر: " + (data.detail || "سرور کا مسئلہ!"));
      }
    } catch (err) {
      alert("❌ سرور سے کنکشن نہیں ہو سکا۔");
    }
  }

  // 10 سیکنڈ بعد اسٹیٹس چیک کرنے اور ویڈیو لنک دکھانے کا فنکشن
  async function pollStatus(serverUrl, jobId) {
    const interval = setInterval(async () => {
      try {
        const res = await fetch(`${serverUrl}/status/${jobId}`);
        const result = await res.json();
        
        if(result.status === "completed") {
          clearInterval(interval);
          const fullVideoUrl = `${serverUrl}${result.video_url}`;
          alert("🎉 مبارک ہو! ویڈیو تیار ہے!\nڈاؤن لوڈ کریں: " + fullVideoUrl);
          window.open(fullVideoUrl, '_blank');
        } else if(result.status === "failed") {
          clearInterval(interval);
          alert("❌ ویڈیو رینڈرنگ میں مسئلہ آ گیا: " + result.error);
        }
      } catch (e) {
        console.log("Waiting for video render...");
      }
    }, 10000); // 10 seconds check
  }
       </script>
