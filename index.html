<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khan Institute YT Automation (Free & Pro Studio)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background: #0a0d0b; 
    color: #eef0ec; 
    font-family: system-ui, -apple-system, sans-serif; 
    padding: 20px 10px; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
  }
  .box { 
    width: 100%; 
    max-width: 620px; 
    background: #131815; 
    padding: 28px; 
    border-radius: 16px; 
    border: 1px solid #222b26; 
    box-shadow: 0 16px 40px rgba(0,0,0,0.8); 
  }
  
  .header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid #222b26; padding-bottom: 14px; }
  .header h2 { font-size: 22px; color: #fff; letter-spacing: 0.5px; }
  .header p { color: #8a958d; font-size: 12px; margin-top: 4px; }
  
  .section-title { font-size: 12px; color: #c9f158; font-weight: 700; text-transform: uppercase; margin: 18px 0 10px 0; display: flex; align-items: center; gap: 6px; }
  .section-title::after { content: ''; flex: 1; height: 1px; background: #222b26; }
  
  .pro-badge { background: #c9f158; color: #000; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 6px; }

  .form-group { margin-bottom: 14px; text-align: left; }
  label { font-size: 11px; color: #a3b3a9; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-weight: 600; }
  
  input, textarea, select { width: 100%; padding: 11px 13px; background: #0c0f0d; border: 1px solid #222b26; color: #fff; border-radius: 8px; font-size: 13px; outline: none; transition: 0.2s; }
  input:focus, textarea:focus, select:focus { border-color: #c9f158; }
  textarea { resize: vertical; min-height: 90px; }
  
  .row { display: flex; gap: 10px; }
  .col { flex: 1; }
  
  .btn-main { width: 100%; padding: 15px; background: #c9f158; color: #000; font-weight: 800; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; margin-top: 15px; transition: 0.2s; }
  .btn-main:hover { background: #b5dc43; }
  
  .footer-branding { text-align: center; margin-top: 20px; padding-top: 12px; border-top: 1px solid #1f2722; font-size: 12px; color: #8a958d; }
  .footer-branding span { color: #c9f158; font-weight: 700; }
</style>
</head>
<body>

<div class="box">
  <div class="header">
    <h2>Khan Institute YT Automation</h2>
    <p>AI Video Studio — Free & Pro Modes</p>
  </div>

  <!-- Server Link & Pro Password -->
  <span class="section-title">1. Server & Authentication</span>
  <div class="row">
    <div class="col form-group">
      <label>🔗 Render Server URL</label>
      <input type="text" id="serverUrl" value="https://khan-yt-backend.onrender.com">
    </div>
    <div class="col form-group">
      <label>🔑 Pro Access Password <span class="pro-badge">PRO</span></label>
      <input type="password" id="proPassword" placeholder="Enter Pro Password for Pro Features">
    </div>
  </div>

  <!-- Basic vs Pro Captions -->
  <span class="section-title">2. Visuals & Captions</span>
  <div class="row">
    <div class="col form-group">
      <label>🎨 Visual Style Preset</label>
      <select id="visualStyle">
        <option value="cinematic-doc">Cinematic Documentary</option>
        <option value="3d-anim">3D Animation / Pixar</option>
        <option value="whiteboard">Whiteboard Explainer</option>
      </select>
    </div>
    <div class="col form-group">
      <label>💬 Caption Styles</label>
      <select id="captionStyle">
        <option value="clean-sub">Standard Cinema Subtitles (Free)</option>
        <option value="capcut-yellow">CapCut Yellow Highlight (Pro 🔑)</option>
        <option value="tiktok-bold">TikTok Dynamic Pop-up (Pro 🔑)</option>
        <option value="off">Disable Captions</option>
      </select>
    </div>
  </div>

  <!-- Custom BGM Upload & Sound FX -->
  <span class="section-title">3. BGM Upload & Transition SFX</span>
  <div class="form-group">
    <label>🎵 Upload Custom Background Music (MP3) <span class="pro-badge">PRO 🔑</span></label>
    <input type="file" id="bgmFile" accept="audio/*">
  </div>

  <div class="row">
    <div class="col form-group">
      <label>🔊 Scene Transition SFX <span class="pro-badge">PRO 🔑</span></label>
      <select id="sfxMode">
        <option value="none">No Transition SFX (Free)</option>
        <option value="whoosh-impact">Auto Whooshes on Scene Switch (Pro 🔑)</option>
        <option value="subtle-cinematic">Cinematic Sub-Hits (Pro 🔑)</option>
      </select>
    </div>
    <div class="col form-group">
      <label>🎥 Camera Motion</label>
      <select id="cameraMotion">
        <option value="static">Static Image (Free)</option>
        <option value="ken-burns">Dynamic Ken Burns Zoom (Pro 🔑)</option>
      </select>
    </div>
  </div>

  <!-- Voiceover Controls -->
  <span class="section-title">4. Voiceover & Pro Humanizer</span>
  <div class="row">
    <div class="col form-group">
      <label>🎙️ Voiceover Model</label>
      <select id="voiceGender">
        <option value="male-standard">👨 Standard Urdu Male (Free)</option>
        <option value="female-standard">👩 Standard Urdu Female (Free)</option>
      </select>
    </div>
    <div class="col form-group">
      <label>🎭 Emotion & Humanizer <span class="pro-badge">PRO 🔑</span></label>
      <select id="voiceEmotion">
        <option value="none">Standard Pitch & Tone (Free)</option>
        <option value="deep-doc">Deep Dramatic Documentary (Pro 🔑)</option>
        <option value="energetic">High Energy Storytelling (Pro 🔑)</option>
      </select>
    </div>
  </div>

  <!-- Script Input -->
  <span class="section-title">5. Script Input</span>
  <div class="form-group">
    <label>📝 Script (Voice Line || Image Prompt)</label>
    <textarea id="scriptInput" placeholder="Voice Line || Image Prompt"></textarea>
  </div>

  <button class="btn-main" onclick="startRender()">🚀 GENERATE AUTOMATED VIDEO</button>

  <div class="footer-branding">
    Created with ❤️ by <span>Cyber Expert Ahmad Khan</span>
  </div>
</div>

<script>
  async function startRender() {
    const serverUrl = document.getElementById('serverUrl').value.trim();
    const password = document.getElementById('proPassword').value.trim();
    const visualStyle = document.getElementById('visualStyle').value;
    const captionStyle = document.getElementById('captionStyle').value;
    const bgmFileInput = document.getElementById('bgmFile');
    const sfxMode = document.getElementById('sfxMode').value;
    const cameraMotion = document.getElementById('cameraMotion').value;
    const voiceGender = document.getElementById('voiceGender').value;
    const voiceEmotion = document.getElementById('voiceEmotion').value;
    const script = document.getElementById('scriptInput').value.trim();
    
    if(!serverUrl) { alert("سرور URL درج کریں!"); return; }
    if(!script) { alert("اسکرپٹ درج کریں!"); return; }

    // Pro Feature Lock Verification
    const isProFeatureUsed = (
      captionStyle.includes('capcut') || captionStyle.includes('tiktok') ||
      bgmFileInput.files.length > 0 ||
      sfxMode !== 'none' ||
      cameraMotion !== 'static' ||
      voiceEmotion !== 'none'
    );

    if(isProFeatureUsed && !password) {
      alert("🔒 آپ پرو فیچرز (Custom BGM, CapCut Captions, SFX) استعمال کر رہے ہیں۔ براہ کرم پہلے Pro Access Password درج کریں!");
      return;
    }
    
    const formData = new FormData();
    formData.append('password', password);
    formData.append('script', script);
    formData.append('visualStyle', visualStyle);
    formData.append('captionStyle', captionStyle);
    formData.append('sfxMode', sfxMode);
    formData.append('cameraMotion', cameraMotion);
    formData.append('voiceGender', voiceGender);
    formData.append('voiceEmotion', voiceEmotion);

    if(bgmFileInput.files.length > 0) {
      formData.append('bgmFile', bgmFileInput.files[0]);
    }

    try {
      const response = await fetch(`${serverUrl}/render`, { method: 'POST', body: formData });
      const data = await response.json();
      if(response.ok) {
        alert("🚀 ویڈیو رینڈرنگ پروسیس شروع ہو گیا ہے! جاب ID: " + data.job_id);
      } else {
        alert("❌ ایرر: " + (data.detail || "غلط پاسورڈ یا سرور ایشو!"));
      }
    } catch (err) {
      alert("❌ سرور سے کنکشن قائم نہیں ہو سکا۔ چیک کریں کہ Render سرور آن ہے۔");
    }
  }
</script>

</body>
</html>
