<!-- نیا انٹرفیس جس میں پرو-پاسورڈ، اسٹائل سلیکٹر، اور سائلنس ٹرمنگ کے آپشنز ہیں -->
<div class="box">
  <h2>Khan Institute YT Automation (Power Mode)</h2>
  
  <!-- پرو پاسورڈ تاکہ صرف آپ یا آپ کے کلائنٹ استعمال کر سکیں -->
  <div class="form-group">
    <label>🔑 Pro Access Password</label>
    <input type="password" id="proPassword" placeholder="Enter Password for Pro Features">
  </div>

  <div class="row">
    <div class="col form-group">
      <label>🎨 Visual Style</label>
      <select id="style">
        <option value="cinematic-doc">Cinematic Documentary</option>
        <option value="3d-animation">3D Animation</option>
        <option value="anime">Anime Style</option>
        <option value="whiteboard">Whiteboard / Hand Draw</option>
      </select>
    </div>
    <div class="col form-group">
      <label>🖼️ Scene Source</label>
      <select id="sceneSource">
        <option value="flux">AI Flux Generation Only</option>
        <option value="mixed">Hybrid (Wiki Mix + Flux)</option>
      </select>
    </div>
  </div>

  <div class="form-group">
    <label>🤖 Consistent Character Description</label>
    <input type="text" id="character" placeholder="e.g. A young historian wearing glasses, brown coat...">
  </div>

  <div class="row">
    <div class="col form-group">
      <label>✂️ Silence Trim</label>
      <select id="trimSilence">
        <option value="yes">Auto-Remove Silence</option>
        <option value="no">Keep Original</option>
      </select>
    </div>
    <div class="col form-group">
      <label>🎵 BGM Volume Sync</label>
      <select id="bgmSync">
        <option value="auto">Auto-Adjust Volume</option>
      </select>
    </div>
  </div>

  <textarea id="script-input" placeholder="Voice Line || Image Prompt"></textarea>
  <button class="btn-main" onclick="startPowerRender()">🚀 START PARALLEL POWER RENDER</button>
</div>
