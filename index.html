<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khan Institute Studio Automation</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0c0f0d; color: #eef0ec; font-family: system-ui, -apple-system, sans-serif; padding: 20px 10px; display: flex; justify-content: center; }
  .box { width: 100%; max-width: 600px; background: #141a17; padding: 24px; border-radius: 16px; border: 1px solid #232d28; box-shadow: 0 12px 32px rgba(0,0,0,0.6); }
  .header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid #232d28; padding-bottom: 12px; }
  .header h2 { font-size: 20px; color: #fff; }
  .header p { color: #8a958d; font-size: 12px; margin-top: 4px; }
  
  .section-title { font-size: 13px; color: #c9f158; font-weight: 700; text-transform: uppercase; margin: 16px 0 8px 0; display: block; border-left: 3px solid #c9f158; padding-left: 8px; }
  .form-group { margin-bottom: 14px; text-align: left; }
  label { font-size: 11px; color: #a3b3a9; display: block; margin-bottom: 5px; font-weight: 600; }
  
  input, textarea, select { width: 100%; padding: 10px 12px; background: #0f1311; border: 1px solid #232d28; color: #fff; border-radius: 8px; font-size: 13px; outline: none; }
  input:focus, textarea:focus, select:focus { border-color: #c9f158; }
  textarea { resize: vertical; min-height: 90px; }
  
  .row { display: flex; gap: 10px; }
  .col { flex: 1; }
  
  .badge-pro { background: #ffb703; color: #000; font-size: 9px; padding: 2px 5px; border-radius: 4px; font-weight: bold; margin-left: 5px; }
  
  .btn-main { width: 100%; padding: 14px; background: #c9f158; color: #000; font-weight: 800; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; margin-top: 15px; }
  .btn-sec { width: 100%; padding: 10px; background: #1c2420; color: #c9f158; font-weight: 600; border: 1px solid #2a3630; border-radius: 8px; cursor: pointer; font-size: 12px; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="box">
  <div class="header">
    <h2>Khan Institute Studio Automator</h2>
    <p>Custom Manual Controls for Long & Short Videos</p>
  </div>

  <!-- 1. Video Layout & Dimensions -->
  <span class="section-title">1. Video Dimensions & Engine</span>
  <div class="row">
    <div class="col form-group">
      <label for="aspectRatio">📐 Video Format</label>
      <select id="aspectRatio">
        <option value="16:9" selected>🖥️ Long Video (16:9 Youtube)</option>
        <option value="9:16">📱 Shorts / Reel (9:16 Vertical)</option>
      </select>
    </div>
    <div class="col form-group">
      <label for="imageEngine">🖼️ Image Model</label>
      <select id="imageEngine">
        <option value="pollinations-flux">Flux AI (4K Ultra Real)</option>
        <option value="wikimedia">Wikimedia (Real Photos)</option>
      </select>
    </div>
  </div>

  <!-- 2. Voiceover & Audio Settings -->
  <span class="section-title">2. Voiceover & Audio Settings</span>
  <div class="form-group">
    <label for="voiceSource">🎙️ Voiceover Source</label>
    <select id="voiceSource">
      <option value="record">Record Voiceover directly (Teleprompter)</option>
      <option value="upload">Upload MP3 / SpeechMa Audio</option>
      <option value="auto-tts">Auto AI Voiceover Generation</option>
    </select>
  </div>
  
  <div class="form-group">
    <label for="voiceFx">
      🎛️ Voice Enhancement & Humanizer 
      <span class="badge-pro">PRO</span>
    </label>
    <select id="voiceFx" onchange="checkPro(this)">
      <option value="normal">Raw Voice (No Effects)</option>
      <option value="studio">🔒 Studio Equalizer & Compressor (Pro)</option>
      <option value="deep">🔒 Deep Documentary Vocal Tone (Pro)</option>
    </select>
  </div>

  <!-- 3. Background Music & FX -->
  <span class="section-title">3. Background Music (BGM) & Style</span>
  <div class="row">
    <div class="col form-group">
      <label for="bgmSelect">🎵 Background Music</label>
      <select id="bgmSelect">
        <option value="custom">Custom Upload (Your own MP3)</option>
        <option value="dramatic">Dramatic Documentary (Built-in)</option>
        <option value="history">Historical Suspense (Built-in)</option>
        <option value="none">No Background Music</option>
      </select>
    </div>
    <div class="col form-group">
      <label for="nicheStyle">🎨 Visual Style Preset</label>
      <select id="nicheStyle">
        <option value="history">📜 History & War</option>
        <option value="science">🔬 Science & Tech</option>
        <option value="politics">🏛️ Politics & News</option>
        <option value="disaster">💥 Disaster Analysis</option>
      </select>
    </div>
  </div>

  <!-- 4. Script & Processing -->
  <span class="section-title">4. Script & Scene Sync</span>
  <button class="btn-sec" onclick="copyPrompt()">📋 Copy Script Generator Prompt (Gemini/NotebookLM)</button>
  
  <div class="form-group">
    <label for="script-input">📝 Script Input (Format: Voiceover Line || Image Prompt)</label>
    <textarea id="script-input" placeholder="پاکستان کی تاریخ کا ایک بڑا موڑ || 1970s historical photo, political rally, cinematic lighting"></textarea>
  </div>

  <button class="btn-main" onclick="startRender()">🚀 START RENDERING VIDEO</button>
</div>

<script>
  let isPro = false;

  function checkPro(elem) {
    if (elem.value !== 'normal' && !isPro) {
      alert("👑 یہ وائس ایفیکٹ صرف PRO ممبرز کے لیے ہے۔");
      elem.value = 'normal';
    }
  }

  function copyPrompt() {
    const p = `You are an expert YouTube documentary writer. Output line by line in this format:
Voiceover Line || English Image Prompt`;
    navigator.clipboard.writeText(p);
    alert("Prompt کاپی ہو گیا ہے!");
  }

  function startRender() {
    const txt = document.getElementById('script-input').value;
    if(!txt.trim()){
      alert("براہ کرم اسکرپٹ ایڈ کریں!");
      return;
    }
    alert("ویڈیو رینڈرنگ پروسیس شروع ہو گیا ہے!");
  }
</script>

</body>
</html>
