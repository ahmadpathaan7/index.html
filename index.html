<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khan Studio AI</title>
  <style>
    body { background-color: #121212; color: #ffffff; font-family: sans-serif; padding: 15px; text-align: center; }
    .container { max-width: 500px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 12px; border: 1px solid #333; }
    label { display: block; text-align: left; margin-top: 12px; font-size: 13px; color: #aaa; font-weight: bold; }
    input, select, textarea, button { width: 100%; margin-top: 5px; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; box-sizing: border-box; }
    
    .pass-group { display: flex; gap: 8px; margin-top: 5px; }
    .pass-group input { flex: 1; margin-top: 0; }
    .unlock-btn { width: 35%; margin-top: 0; background-color: #3b82f6; color: #fff; border: none; font-weight: bold; cursor: pointer; }
    .check-btn { width: 35%; margin-top: 0; background-color: #a855f7; color: #fff; border: none; font-weight: bold; cursor: pointer; }
    
    button.gen-btn { background-color: #9ecc3b; color: #000; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 20px; border: none; }
    #statusArea { margin-top: 20px; padding: 15px; background: #2a2a2a; border-radius: 8px; display: none; }
    .download-link { display: inline-block; margin-top: 10px; padding: 10px 20px; background: #9ecc3b; color: #000; text-decoration: none; font-weight: bold; border-radius: 6px; }
    
    textarea { height: 100px; resize: vertical; }
    .pro-tag { color: #eab308; font-size: 11px; float: right; font-weight: bold; }
    .status-msg { font-size: 12px; text-align: left; margin-top: 4px; font-weight: bold; }
    hr { border: 0; height: 1px; background: #333; margin: 20px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🚀 Khan Automation Studio</h2>
    
    <!-- Status Checker Section -->
    <label>🔍 Check Status by Job ID:</label>
    <div class="pass-group">
      <input type="text" id="checkJobId" placeholder="Enter Job ID (e.g. 621695)">
      <button class="check-btn" onclick="checkJobStatus()">Check Status</button>
    </div>

    <hr>

    <!-- Password Unlock System -->
    <label>🔑 Pro Access Password:</label>
    <div class="pass-group">
      <input type="password" id="proPassword" placeholder="Enter Pro Password">
      <button class="unlock-btn" onclick="verifyPassword()">Unlock Pro</button>
    </div>
    <div id="passStatus" class="status-msg"></div>

    <!-- Visual Settings & Format -->
    <label>1. VIDEO FORMAT & VISUAL ENGINE</label>
    <label style="margin-top:2px;">Video Type / Aspect Ratio:</label>
    <select id="videoFormat">
      <option value="9:16">📱 Short / Reel / TikTok (9:16)</option>
      <option value="16:9">📺 Long YouTube Video (16:9)</option>
    </select>

    <label style="margin-top:5px;">Visual Style:</label>
    <select id="visualStyle">
      <option value="cinematic-doc">Cinematic Documentary</option>
      <option value="hyper-real">Hyper Realistic</option>
    </select>

    <label style="margin-top:5px;">Image Generation Engine <span class="pro-tag">🔒 PRO</span>:</label>
    <select id="imageEngine" disabled>
      <option value="standard-web">Wikipedia / Web Sourced Images (Free)</option>
      <option value="flux-ai">🎨 Flux AI High-Quality Image Gen (PRO)</option>
      <option value="hybrid-flux">⚡ Hybrid (Flux AI + Wikipedia Real Images) (PRO)</option>
    </select>

    <!-- Voiceover & Language Settings -->
    <label>2. VOICEOVER & LANGUAGE SELECTION</label>
    <select id="voiceGender">
      <option value="male-ur">👨 Standard Urdu Male</option>
      <option value="female-ur">👩 Standard Urdu Female</option>
      <option value="male-en">👨 Standard English Male</option>
      <option value="female-en">👩 Standard English Female</option>
    </select>

    <label style="margin-top:5px;">Emotion & Voice Humanizer <span class="pro-tag">🔒 PRO</span>:</label>
    <select id="voiceEmotion" disabled>
      <option value="none">Standard Pitch & Tone</option>
      <option value="dramatic">Deep Dramatic Documentary (PRO)</option>
    </select>

    <!-- Video Effects & Captions -->
    <label>3. CAPTION & MOTION EFFECTS</label>
    <label style="margin-top:2px;">Caption Style <span class="pro-tag">🔒 PRO</span>:</label>
    <select id="captionStyle" disabled>
      <option value="clean-sub">Standard Cinema Subtitles</option>
      <option value="capcut-yellow">CapCut Dynamic Yellow (PRO)</option>
    </select>

    <label style="margin-top:5px;">Camera Motion <span class="pro-tag">🔒 PRO</span>:</label>
    <select id="cameraMotion" disabled>
      <option value="static">Static Image</option>
      <option value="ken-burns">Dynamic Ken Burns Zoom (PRO)</option>
    </select>

    <!-- Audio & Transitions -->
    <label>4. MUSIC & SOUND EFFECTS</label>
    <label style="margin-top:2px;">Scene Transition SFX <span class="pro-tag">🔒 PRO</span>:</label>
    <select id="sfxMode" disabled>
      <option value="none">No Transition SFX</option>
      <option value="whoosh">Auto Whooshes on Scene (PRO)</option>
    </select>

    <label style="margin-top:5px;">🎵 Upload Custom Background Music (MP3):</label>
    <input type="file" id="bgmFile" accept="audio/*">

    <!-- Script Input -->
    <label>5. SCRIPT INPUT</label>
    <textarea id="scriptInput" placeholder="یہ کہانی ہے... || A dramatic shot of..."></textarea>

    <button class="gen-btn" onclick="startRender()">🚀 GENERATE AUTOMATED VIDEO</button>

    <!-- Status & Download Area -->
    <div id="statusArea">
      <div id="statusText">Processing...</div>
    </div>
  </div>

  <script>
    const serverUrl = "https://khan-yt-backend.onrender.com";
    let pollInterval = null;

    // Load saved Pro Key and Last Job ID on page load
    window.onload = () => {
      const savedPass = localStorage.getItem('pro_pass');
      if (savedPass) {
        document.getElementById('proPassword').value = savedPass;
        verifyPassword();
      }
      const lastJobId = localStorage.getItem('last_job_id');
      if (lastJobId) {
        document.getElementById('checkJobId').value = lastJobId;
      }
    };

    function showStatus(text, showDownload = false, url = "") {
      const area = document.getElementById('statusArea');
      const textDiv = document.getElementById('statusText');
      area.style.display = 'block';

      if (showDownload) {
        textDiv.innerHTML = `${text}<br><a href="${url}" class="download-link" download target="_blank">📥 Download Video MP4</a>`;
      } else {
        textDiv.innerHTML = text;
      }
    }

    function verifyPassword() {
      const pass = document.getElementById('proPassword').value.trim();
      const statusMsg = document.getElementById('passStatus');
      
      if (pass === "khan_pro_automation") {
        statusMsg.style.color = "#22c55e";
        statusMsg.innerText = "🟢 PRO Features Unlocked Successfully!";
        localStorage.setItem('pro_pass', pass);
        
        // Enable PRO Dropdowns
        document.getElementById('imageEngine').disabled = false;
        document.getElementById('voiceEmotion').disabled = false;
        document.getElementById('captionStyle').disabled = false;
        document.getElementById('cameraMotion').disabled = false;
        document.getElementById('sfxMode').disabled = false;
      } else {
        statusMsg.style.color = "#ef4444";
        statusMsg.innerText = "❌ Incorrect Pro Password!";
      }
    }

    async function pollStatus(jobId) {
      try {
        const res = await fetch(`${serverUrl}/status/${jobId}`);
        if (!res.ok) {
          showStatus("❌ Job ID نہیں ملی یا سرور ایرر آیا۔");
          clearInterval(pollInterval);
          return;
        }
        
        const result = await res.json();
        
        if (result.status === "completed") {
          clearInterval(pollInterval);
          showStatus("🎉 ویڈیو کامیابی کے ساتھ تیار ہو گئی ہے!", true, `${serverUrl}${result.video_url}`);
        } else if (result.status === "processing") {
          showStatus(`⏳ پروسیسنگ جاری ہے... (Job ID: ${jobId})<br><small>براہ کرم انتظار کریں، اسٹیٹس خود بخود اپ ڈیٹ ہو جائے گا۔</small>`);
        } else if (result.status === "failed") {
          clearInterval(pollInterval);
          showStatus(`❌ ویڈیو رینڈرنگ میں مسئلہ آیا: ${result.error || 'Unknown Error'}`);
        }
      } catch (e) {
        showStatus("⏳ سرور سے رابطہ قائم کیا جا رہا ہے۔۔۔");
      }
    }

    function checkJobStatus() {
      const jobId = document.getElementById('checkJobId').value.trim();
      if (!jobId) { alert("براہ کرم Job ID درج کریں!"); return; }
      
      localStorage.setItem('last_job_id', jobId);
      if (pollInterval) clearInterval(pollInterval);
      pollStatus(jobId);
      pollInterval = setInterval(() => pollStatus(jobId), 5000);
    }

    async function startRender() {
      const script = document.getElementById('scriptInput').value.trim();
      if (!script) { alert("براہ کرم اسکرپٹ درج کریں!"); return; }

      const formData = new FormData();
      formData.append('password', document.getElementById('proPassword').value.trim());
      formData.append('script', script);
      formData.append('videoFormat', document.getElementById('videoFormat').value);
      formData.append('visualStyle', document.getElementById('visualStyle').value);
      formData.append('imageEngine', document.getElementById('imageEngine').value);
      formData.append('voiceGender', document.getElementById('voiceGender').value);
      formData.append('voiceEmotion', document.getElementById('voiceEmotion').value);
      formData.append('captionStyle', document.getElementById('captionStyle').value);
      formData.append('sfxMode', document.getElementById('sfxMode').value);
      formData.append('cameraMotion', document.getElementById('cameraMotion').value);

      const bgm = document.getElementById('bgmFile').files[0];
      if (bgm) formData.append('bgmFile', bgm);

      showStatus("🚀 ریکویسٹ بھیجی جا رہی ہے، براہ کرم انتظار کریں...");

      try {
        const response = await fetch(`${serverUrl}/render`, { method: 'POST', body: formData });
        const data = await response.json();
        
        if (response.ok && data.job_id) {
          document.getElementById('checkJobId').value = data.job_id;
          localStorage.setItem('last_job_id', data.job_id);
          
          if (pollInterval) clearInterval(pollInterval);
          pollStatus(data.job_id);
          pollInterval = setInterval(() => pollStatus(data.job_id), 5000);
        } else {
          showStatus("❌ " + (data.detail || "ریکویسٹ بھیجنے میں مسئلہ آیا۔"));
        }
      } catch (err) {
        showStatus("❌ سرور کنیکشن فیل ہو گیا۔ یقینی بنائیں کہ Render Backend لائیو ہے۔");
      }
    }
  </script>
</body>
</html>
